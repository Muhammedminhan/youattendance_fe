# YOUAttendance — Nginx configuration
# 1. Copy your dist/ build to the server (e.g. /var/www/youattendance)
# 2. Paste this block inside your server { } block:
#      include /path/to/nginx-security-headers.conf;
# Re-run `node scripts/generate-headers.js` after changing VITE_API_BASE_URL.

location / {
    root /var/www/youattendance;   # <- update to your actual dist path
    index index.html;
    try_files $uri $uri/ /index.html;  # SPA fallback routing

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://ui-avatars.com https://lh3.googleusercontent.com; connect-src 'self' https://accounts.google.com https://api.youattendance.com; frame-src https://accounts.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
}
